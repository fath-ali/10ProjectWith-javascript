<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <div class="calculator" role="application" aria-label="Calculator">
        <input id="display" class="display" type="text" value="0" inputmode="numeric" aria-live="polite" aria-label="Calculator display" readonly />
        <div class="keys" role="group" aria-label="Calculator keys">
          <button class="btn function" data-action="clear-all" aria-label="All clear">AC</button>
          <button class="btn function" data-action="clear-entry" aria-label="Clear entry">C</button>
          <button class="btn function" data-action="percent" aria-label="Percent">%</button>
          <button class="btn operator" data-operator="/" aria-label="Divide">÷</button>

          <button class="btn digit" data-digit="7">7</button>
          <button class="btn digit" data-digit="8">8</button>
          <button class="btn digit" data-digit="9">9</button>
          <button class="btn operator" data-operator="*" aria-label="Multiply">×</button>

          <button class="btn digit" data-digit="4">4</button>
          <button class="btn digit" data-digit="5">5</button>
          <button class="btn digit" data-digit="6">6</button>
          <button class="btn operator" data-operator="-" aria-label="Subtract">−</button>

          <button class="btn digit" data-digit="1">1</button>
          <button class="btn digit" data-digit="2">2</button>
          <button class="btn digit" data-digit="3">3</button>
          <button class="btn operator" data-operator="+" aria-label="Add">+</button>

          <button class="btn function" data-action="toggle-sign" aria-label="Toggle sign">±</button>
          <button class="btn digit span-2" data-digit="0">0</button>
          <button class="btn digit" data-action="decimal" aria-label="Decimal">.</button>
          <button class="btn equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </div>
      <footer class="footer">Keyboard: 0-9, ., + - * /, Enter(=), Backspace(C), Esc(AC), %(percent)</footer>
    </main>
    <script defer src="./script.js"></script>
  </body>
</html>
